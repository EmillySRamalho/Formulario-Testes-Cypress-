<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Formulário Completo</title>
</head>
<body>
    <!DOCTYPE html>
    <html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulário de Teste Cypress</title>
    </head>

    <body>
        <form id="formulario">
            <h1>Formulário de Teste Cypress</h1>
            <fieldset>
                <legend>Informações Pessoais</legend>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required><br><br>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" minlength="6" placeholder="Mínimo 6 caracteres"
                    required><br><br>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="1" max="120"><br><br>

                <label for="data">Data de Nascimento:</label>
                <input type="date" id="data" name="data"><br><br>
            </fieldset>

            <fieldset>
                <legend>Contato e Preferências</legend>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}"
                    placeholder="Ex: 11-99999-9999"><br><br>

                <label for="url">Website:</label>
                <input type="url" id="url" name="url" placeholder="https://"><br><br>

                <label for="arquivo">Escolha um arquivo:</label>
                <input type="file" id="arquivo" name="arquivo"><br><br>

                <label>Gênero:</label><br>
                <input type="radio" name="genero" value="F"> Feminino
                <input type="radio" name="genero" value="M"> Masculino
                <input type="radio" name="genero" value="O"> Outro<br><br>

                <label>Interesses:</label><br>
                <input type="checkbox" name="interesse" value="música"> Música
                <input type="checkbox" name="interesse" value="esporte"> Esporte
                <input type="checkbox" name="interesse" value="tecnologia"> Tecnologia
                <input type="checkbox" name="interesse" value="arte"> Arte
                <input type="checkbox" name="interesse" value="viagem"> Viagem
                <input type="checkbox" name="interesse" value="leitura"> Leitura
                <input type="checkbox" name="interesse" value="outro"> Outro
                <br><br>

                <label for="pais">País:</label>
                <select id="pais" name="pais">
                    <option value="">Selecione</option>
                    <option value="br">Brasil</option>
                    <option value="pt">Portugal</option>
                    <option value="us">Estados Unidos</option>
                </select><br><br>

                <label for="comentario">Comentários:</label><br>
                <textarea id="comentario" name="comentario" rows="4" cols="50"
                    placeholder="Digite algo..."></textarea><br><br>
            </fieldset>

            <fieldset>
                <legend>Avaliação</legend>
                <label for="satisfacao">Nível de satisfação (1 a 10):</label><br>
                <input type="range" id="satisfacao" name="satisfacao" min="1" max="10" value="5"><br><br>

                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Aceito os termos e condições</label><br><br>
            </fieldset>

            <button type="reset" value="Limpar">Limpar</button>
            <button type="submit" value="Enviar">Enviar</button>
        </form>

        <footer>
            <p>&copy; 2025 Testes Cypress. Todos os direitos reservados.</p>
        </footer>
    </body>

    </html>
